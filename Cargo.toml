[package]
name = "mmu-teach"
version = "0.1.0"
edition = "2021"
description = "受限多级页表与 TLB 地址翻译教学服务（纯模拟，不操作真实内核页表）"
license = "MIT"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
