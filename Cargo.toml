[package]
name = "collation-agg-contract"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "String collation-aware grouping/dedup executors (sort vs hash) over typed Arrow2 batches, with an Axum verification API"

[dependencies]
arrow2 = { version = "0.18", features = ["io_ipc"] }
axum = { version = "0.7", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-normalization = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "collation-agg-contract"
path = "src/main.rs"

[profile.release]
lto = "thin"
