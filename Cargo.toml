[package]
name = "collate_agg"
version = "0.1.0"
edition = "2021"
description = "Custom-collation string grouping/dedup: sort-agg vs hash-agg comparison contract"
license = "MIT"

[lib]
name = "collate_agg"
path = "src/lib.rs"

[[bin]]
name = "collate_agg"
path = "src/main.rs"

[dependencies]
arrow2 = { version = "0.18", default-features = false, features = ["compute"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
