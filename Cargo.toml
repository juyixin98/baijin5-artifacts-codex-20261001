[package]
name = "arc-cache"
version = "0.1.0"
edition = "2021"
description = "ARC (Adaptive Replacement Cache) page replacement engine with local replay, write-back adapter and diagnostics"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"
