[package]
name = "recursive-cte"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
description = "Restricted WITH RECURSIVE execution backend (UNION / UNION ALL, path cycle marking)"

[dependencies]
arrow2 = "0.18"
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "json"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
