[package]
name = "fologic"
version = "0.1.0"
edition = "2021"
description = "Quantifier elimination and model checking for first-order logic over finite enumerated domains"

[lib]
name = "fologic"
path = "src/lib.rs"

[[bin]]
name = "fologic"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
# Keep tests fast while retaining debug information in the proof logs.
debug = 1

[[example]]
name = "gen_fixtures"
path = "examples/gen_fixtures.rs"

[[example]]
name = "tcp_client"
path = "examples/tcp_client.rs"
