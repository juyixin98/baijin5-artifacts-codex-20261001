[package]
name = "mmap-model"
version = "0.1.0"
edition = "2021"
description = "In-memory page model for shared/private file mappings with COW, sync, truncate and unmap semantics, plus an Axum diagnostic interface"
license = "MIT"

[dependencies]
axum = "=0.8.4"
tokio = { version = "=1.47.1", features = ["full"] }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
thiserror = "=2.0.12"
tracing = "=0.1.41"
tracing-subscriber = { version = "=0.3.19", features = ["env-filter", "fmt"] }
hex = "=0.4.3"
toml = "=0.8.23"

[dev-dependencies]
tower = { version = "=0.5.2", features = ["util"] }
reqwest = { version = "=0.12.15", features = ["json"] }
http-body-util = "=0.1.3"
