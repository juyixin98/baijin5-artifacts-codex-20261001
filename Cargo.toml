[workspace]
resolver = "2"
members = [
    "crates/sl-types",
    "crates/sl-config",
    "crates/sl-resource",
    "crates/sl-operator",
    "crates/sl-fixture",
    "crates/sl-validate",
    "crates/sl-server",
    "crates/sl-qa",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
description = "Backend ORDER BY ... LIMIT/OFFSET ... WITH TIES engine (typed batches, streaming top-N, budget-aware state)"

[workspace.dependencies]
# First-party crates
sl-types = { path = "crates/sl-types", version = "0.1.0" }
sl-config = { path = "crates/sl-config", version = "0.1.0" }
sl-resource = { path = "crates/sl-resource", version = "0.1.0" }
sl-operator = { path = "crates/sl-operator", version = "0.1.0" }
sl-fixture = { path = "crates/sl-fixture", version = "0.1.0" }
sl-validate = { path = "crates/sl-validate", version = "0.1.0" }

# External deps are pinned to exact versions that exist in the local registry
# mirror; Cargo.lock is committed to freeze transitive versions as well.
arrow2 = { version = "=0.18.0", default-features = false, features = ["compute_take", "io_ipc"] }
axum = { version = "=0.7.9" }
tokio = { version = "=1.48.0", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
tower = { version = "=0.4.13" }
hyper = { version = "=1.11.1" }
http = "=1.5.0"
http-body-util = "=0.1.5"
bytes = "=1.12.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=1.0.69"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "ansi", "tracing-log", "smallvec", "std"] }
uuid = { version = "=1.8.0", features = ["v4"] }
tempfile = "=3.27.0"
toml = "=0.8.23"

[profile.release]
lto = "thin"
