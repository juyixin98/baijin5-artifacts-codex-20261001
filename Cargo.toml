[package]
name = "tribool-index"
version = "0.1.0"
edition = "2021"
description = "Column-value bitmap indexes with SQL three-valued-logic filtering (AND/OR/NOT/IS NULL), versioned deletes, Arrow2 batches and an Axum API"
license = "MIT"

[lib]
name = "tribool_index"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "verify"
path = "src/bin/verify.rs"

[dependencies]
# Pinned key dependencies (exact versions reproduced via Cargo.lock).
arrow2 = { version = "=0.18.0" }
axum = "=0.7.5"
tokio = { version = "=1.38.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
tower = { version = "=0.4.13", features = ["limit"] }
serde = { version = "=1.0.203", features = ["derive"] }
serde_json = "=1.0.117"
tracing = "=0.1.40"
tracing-subscriber = { version = "=0.3.18", features = ["env-filter", "fmt"] }
uuid = { version = "=1.8.0", features = ["v4"] }
thiserror = "=1.0.61"
toml = "=0.9.2"

[dev-dependencies]
reqwest = { version = "=0.12.4", features = ["json", "blocking"] }
