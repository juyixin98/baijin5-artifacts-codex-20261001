[package]
name = "cdc-service"
version = "0.1.0"
edition = "2021"
description = "Rolling-hash content-defined chunking service with verifiable manifests"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = { version = "0.5", features = ["limit"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"

[[bin]]
name = "cdc-server"
path = "src/main.rs"

[[bin]]
name = "cdc-report"
path = "src/bin/cdc_report.rs"

[[bin]]
name = "cdc-gen-fixtures"
path = "src/bin/gen_fixtures.rs"
