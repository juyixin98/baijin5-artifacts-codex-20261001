[package]
name = "recursive-cte-backend"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Bounded WITH RECURSIVE execution backend (UNION / UNION ALL, path-aware cycle marking) on Rust + Axum + Arrow2"
license = "MIT OR Apache-2.0"

[lib]
name = "recursive_cte_backend"
path = "src/lib.rs"

[[bin]]
name = "recursive-cte-backend"
path = "src/main.rs"

[dependencies]
arrow2 = { version = "=0.18.0", default-features = false, features = ["io_ipc"] }
axum = "=0.8.9"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
base64 = "=0.22.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
uuid = { version = "=1.26.1", features = ["v4"] }

[dev-dependencies]
# Integration tests decode the Arrow IPC payload independently and drive the
# real HTTP server over a loopback TCP socket using tokio + raw HTTP/1.1.
arrow2 = { version = "=0.18.0", default-features = false, features = ["io_ipc"] }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync"] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 0
