[package]
name = "dnnf-mc"
version = "0.1.0"
edition = "2021"
description = "Exact model counting for decomposable deterministic logic circuits (d-DNNF style)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-bigint = "0.4"

[lib]
name = "dnnf_mc"
path = "src/lib.rs"

[[bin]]
name = "dnnf-mc"
path = "src/main.rs"
