[package]
name = "cfs-sim"
version = "0.1.0"
edition = "2021"
description = "Single-CPU CFS-style fair scheduling simulator over synthetic workloads, with filesystem persistence and an Axum diagnostics API"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
