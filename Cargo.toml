[package]
name = "pull-query"
version = "0.1.0"
edition = "2021"
description = "Composable pull-based query execution framework (scan, blocking spill sort, hash join) with explicit cancellation/resource contracts"
license = "MIT OR Apache-2.0"

[lib]
name = "pull_query"
path = "src/lib.rs"

[[bin]]
name = "pq-server"
path = "src/bin/server.rs"

[dependencies]
arrow2 = { version = "0.18", default-features = false, features = ["compute"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "unwind"

[profile.dev]
panic = "unwind"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
