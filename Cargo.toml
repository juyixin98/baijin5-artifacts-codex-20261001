[package]
name = "cow-snapshot-service"
version = "0.1.0"
edition = "2021"
description = "Copy-on-write snapshot service over a fixed page object space"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
