[package]
name = "merge-check"
version = "0.1.0"
edition = "2021"
description = "Local OCI-style layer merge-check backend: merges unpacked layer directories into a final content tree with whiteout/opaque semantics, provenance and diagnostics."
license = "MIT"

[lib]
name = "merge_check"
path = "src/lib.rs"

[[bin]]
name = "merge-checkd"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
walkdir = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
tempfile = "3"
