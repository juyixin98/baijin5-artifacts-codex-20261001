[workspace]
resolver = "2"
members = [
    "crates/syntax",
    "crates/proof",
    "crates/core",
    "crates/checker",
    "crates/service",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ipc-syntax = { path = "crates/syntax", version = "1.0.0" }
ipc-proof = { path = "crates/proof", version = "1.0.0" }
ipc-core = { path = "crates/core", version = "1.0.0" }
ipc-checker = { path = "crates/checker", version = "1.0.0" }

[profile.release]
lto = "thin"
codegen-units = 16
