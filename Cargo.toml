[package]
name = "pullq"
version = "0.1.0"
edition = "2021"
description = "Composable pull-based query execution framework (scan / blocking sort / hash join)"

[dependencies]
arrow2 = { version = "0.18", default-features = false, features = ["compute", "io_ipc"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
