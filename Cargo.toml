[package]
name = "cdc-service"
version = "0.1.0"
edition = "2021"
description = "Content-defined chunking service (rolling hash, min/max chunk length, target boundary pattern)"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"], default-features = false }
