[workspace]
resolver = "2"
members = [
    "crates/stlc-syntax",
    "crates/stlc-proof",
    "crates/stlc-core",
    "crates/stlc-audit",
    "crates/stlc-service",
    "crates/stlc-fixtures",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
