[package]
name = "blksched"
version = "0.1.0"
edition = "2021"
description = "Local block-request deadline vs SCAN scheduling comparison service"

[lib]
name = "blksched"
path = "src/lib.rs"

[[bin]]
name = "blksched-server"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tower = { version = "0.4", features = ["util"] }
