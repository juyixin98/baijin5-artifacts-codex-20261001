[package]
name = "set_ops"
version = "0.1.0"
edition = "2024"
description = "Typed batched UNION/INTERSECT/EXCEPT (DISTINCT & ALL) with external-memory partitions"

[dependencies]
arrow2 = { version = "0.18", default-features = false }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
