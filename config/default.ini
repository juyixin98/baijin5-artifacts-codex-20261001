# Default backend configuration. Every key is optional in a user config file;
# these are the documented defaults.
#
# Per-job product/remainder-tree memory ceiling (byte-size literal supported:
# plain bytes, KiB/MiB/GiB or KB/MB/GB).
memory_limit = 64MiB
# Estimated bytes per stored coefficient slot. cpp_int values average a small
# heap allocation; 24B/struct + digit storage is covered conservatively.
bytes_per_slot = 24
# Safety multiplier on the analytic slot estimate.
memory_fudge = 2
# 0 = pick the largest batch that fits the memory ceiling automatically.
max_batch_points = 0
