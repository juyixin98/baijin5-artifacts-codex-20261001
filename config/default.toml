# RIB 服务默认配置
# 通过环境变量 RIB_CONFIG 指向其他文件可覆盖本配置。

[server]
host = "127.0.0.1"
port = 8080

[budget]
# 单块允许声明的最大有效值个数
max_values_per_block = 1000000
# 单块允许声明的最大负载字节数
max_payload_bytes = 67108864
# 单个 RLE 块允许的最大 run 数
max_runs_per_block = 1000000
# 一次 decode_column 调用允许产出的总值数
max_total_values = 16000000
