# Default numerical contract for the Pade engine (key=value, # starts comment).
# Singular values below rank_tol_factor * eps * n * sigma_max are treated as 0.
rank_tol_factor = 1e-12
# |D_k| <= residual_tol * (1 + |c_k|) means residual coefficient k vanishes.
residual_tol = 1e-14
# Relative coefficient tolerance used by the Euclidean polynomial GCD.
gcd_tol = 1e-13
# Extra residual coefficients examined beyond the contractual m+n+1.
residual_extra_terms = 6
# Whether the common factor P/Q is diagnosed and divided out (stored separately).
remove_common_factor = true
# Evaluation is a failure when |Q(x)| <= pole_relative_tol * sum|q_j x^j|.
pole_relative_tol = 1e-12
# Synthetic generators produce this many extra terms beyond m+n+1.
series_extra_terms = 8
