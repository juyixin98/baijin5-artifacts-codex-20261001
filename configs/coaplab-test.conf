# Fast, deterministic configuration for the local test suites.
# Bind an ephemeral loopback port; tests read the actual bound address.
listen=127.0.0.1:0
db_path=:memory:

# Deterministic, short retransmission (no random factor, RFC lower bound 1.0).
ack_timeout=40ms
ack_random_factor=1.0
max_retransmit=3
exchange_lifetime=2s

# Short partial-upload retention so expiry (4.08) tests run quickly.
block1_retention=250ms

max_message_size=1280
max_body_bytes=1048576
# Negotiation tests need a server preference smaller than the client's
# initial proposal: 64 bytes (SZX=2) while clients propose 1024 (SZX=6).
preferred_szx=2
token_length=4
