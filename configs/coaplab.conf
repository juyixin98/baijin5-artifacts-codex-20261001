# coapd local configuration (key=value; # starts a comment)
# Bind to loopback only — this is a local lab service.
listen=127.0.0.1:5683

# SQLite database file (use :memory: only inside tests).
db_path=coaplab.db

# --- Reliable messaging, RFC 7252 §4.8 (values are EXPLICIT) ---
# Initial CON retransmission timeout; subsequent timeouts double.
ack_timeout=2s
# Uniform multiplier in [1.0, factor]; 1.0 => deterministic (tests).
# RFC default is 1.5; MUST NOT be below 1.0.
ack_random_factor=1.0
# Retransmissions after the first send; total sends = max_retransmit + 1.
max_retransmit=4
# MID dedup cache TTL and Block1 partial-body upper bound.
exchange_lifetime=247s
# RFC 7959 §2.5: server may discard an unfinished Block1 upload after this.
block1_retention=30s

# --- Protocol subset bounds ---
# Accepted datagram cap (IPv6 minimum MTU minus headers, RFC 7252 §4.6).
max_message_size=1280
# Largest assembled resource body accepted via Block1.
max_body_bytes=1048576
# Server-preferred block exponent 0..6 (16..1024 bytes). Clients proposing
# larger blocks are capped to this in the block-0 response.
preferred_szx=6
# Client token length 1..8 bytes (minted with crypto/rand).
token_length=4
