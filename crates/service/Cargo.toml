[package]
name = "ipc-service"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "CLI and local HTTP front-end for the interpolation workbench"

[lib]
name = "ipc_service"
path = "src/lib.rs"

[[bin]]
name = "ipc"
path = "src/bin/ipc.rs"

[dependencies]
ipc-syntax = { workspace = true }
ipc-proof = { workspace = true }
ipc-core = { workspace = true }
ipc-checker = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
ipc-checker = { workspace = true }
