[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "defeasible-reasoner"
version = "1.0.0"
description = "Explainable defeasible-reasoning backend with a restricted, order-independent semantics"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = ["httpx>=0.27", "pytest>=8.0"]

[project.scripts]
defeasible = "defeasible.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
