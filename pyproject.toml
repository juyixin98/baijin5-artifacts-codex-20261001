[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "txmap"
version = "1.0.0"
description = "Bidirectional transcript <-> genomic coordinate mapping service (synthetic fixtures)"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "numpy==2.4.6",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
markers = [
    "unit: pure domain/unit tests",
    "integration: SQLite/service integration tests",
    "api: HTTP API tests",
]

[tool.coverage.run]
source = ["txmap"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
