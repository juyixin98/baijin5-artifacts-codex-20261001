[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-autodiff"
version = "1.0.0"
description = "Small tensor autodiff backend with broadcasting, matmul, reductions and activations"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[tool.setuptools]
packages = ["autodiff", "autodiff.api"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["autodiff"]
