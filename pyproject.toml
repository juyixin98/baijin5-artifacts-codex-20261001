[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "irsolver"
version = "0.1.0"
description = "Mixed-precision iterative refinement linear solver (low-precision LU factorization + high-precision residual)"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.15.3",
    "mpmath==1.3.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.coverage.run]
source = ["src/irsolver", "config"]

[tool.coverage.report]
show_missing = true
fail_under = 80
