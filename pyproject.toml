[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-embeddings"
version = "1.0.0"
description = "Sparse gradient accumulation and optimizer service for large-vocabulary embedding tables"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["sparse_embeddings*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -v"
markers = [
    "slow: larger-vocabulary numerical checks",
]
