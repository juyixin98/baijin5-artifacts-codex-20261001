[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minigrad"
version = "0.1.0"
description = "Small tensor autodiff backend: broadcasting, matmul, reductions, activations, FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.4.6",
    "fastapi==0.141.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/minigrad"]
