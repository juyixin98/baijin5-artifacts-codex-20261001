[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuped-backend"
version = "0.1.0"
description = "CUPED and linear covariate adjustment backend for randomized experiments with continuous outcomes"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "mcsim: Monte-Carlo statistical property checks (slower)",
    "integration: end-to-end tests that touch SQLite and FastAPI",
]
