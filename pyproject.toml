[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-digest-service"
version = "1.0.0"
description = "Rule-based enzymatic digest fragment enumeration service"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["app*"]
