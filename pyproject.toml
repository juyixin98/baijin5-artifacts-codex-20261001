[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iccconv"
version = "0.1.0"
description = "ICC-based image color conversion backend (RGB / GRAY / restricted CMYK) on littleCMS"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "fastapi>=0.110",
    "pydantic>=2.5",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "uvicorn>=0.29",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
