[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tileconv"
version = "0.1.0"
description = "Tiled convolution and separable filtering service for very large (out-of-core) images"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.15.3",
    "pillow==10.2.0",
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: long-running checks (peak-memory subprocess)",
]
