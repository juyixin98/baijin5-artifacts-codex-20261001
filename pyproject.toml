[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cuped-backend"
version = "0.1.0"
description = "CUPED and linear covariate adjustment backend for continuous-outcome randomized experiments"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "numpy>=1.26",
    "scipy>=1.12",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"
markers = [
    "unit: pure unit tests",
    "integration: tests that exercise storage and API layers",
]
log_cli = false
log_file = "logs/pytest.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s | %(levelname)-7s | %(name)s | %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%S%z"
