[project]
name = "dtw-service"
version = "0.1.0"
description = "Dynamic time warping of synthetic feature sequences: path, cost, local stretch rate"
requires-python = ">=3.12"
dependencies = [
    "numpy==2.4.6",
    "scipy==1.15.3",
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "uvicorn==0.54.0",
    "pyyaml==6.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
