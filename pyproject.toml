[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphcut-segmentation"
version = "1.0.0"
description = "Two-label energy minimization for synthetic images via s-t min-cut"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "numpy>=1.26",
    "scipy>=1.12",
    "pillow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=5.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["graphcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
