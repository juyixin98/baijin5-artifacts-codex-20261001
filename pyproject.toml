[project]
name = "marker-watershed-backend"
version = "0.1.0"
description = "Deterministic marker-based watershed segmentation backend (FastAPI + NumPy/SciPy/Pillow)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy>=1.26",
    "scipy>=1.11",
    "pillow>=10.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
omit = []

[tool.coverage.report]
show_missing = true
fail_under = 80
