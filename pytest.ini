[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --cov=app
    --cov-report=term-missing
markers =
    unit: 单元测试 (规则语言/内核/存储独立模块)
    integration: 集成测试 (FastAPI HTTP 全链路 + SQLite)
filterwarnings =
    ignore::DeprecationWarning
